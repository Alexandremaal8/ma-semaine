<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPFL Calendar</title>
<meta name="theme-color" content="#F4F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EPFL Calendar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one calm column. Today first, one thing at a time; everything else lives in sheets. */
  --bg:#F4F2EF; --surface:#FFFFFF; --ink:#16151A; --muted:#6B6872; --faint:#9C99A3; --line:#E4E1DC; --sunk:#ECE9E4;
  --accent:#2E6B4F; --on-accent:#FFFFFF; --warn:#B4540A; --warn-bg:#FDF0E4; --exam:#D61F45;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E12; --surface:#1A191F; --ink:#F1EFF4; --muted:#A19EA9; --faint:#6E6B75; --line:#2A2830; --sunk:#232129;
    --warn:#F2A363; --warn-bg:#2C2018; --exam:#FF6B85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E12; --surface:#1A191F; --ink:#F1EFF4; --muted:#A19EA9; --faint:#6E6B75; --line:#2A2830; --sunk:#232129;
  --warn:#F2A363; --warn-bg:#2C2018; --exam:#FF6B85; color-scheme:dark;
}
body{--acc:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{--acc:color-mix(in srgb,var(--accent) 65%,white)}}
:root[data-theme="dark"] body{--acc:color-mix(in srgb,var(--accent) 65%,white)}
body[data-mode="chill"]{--accent:#1C76A6}
body[data-mode="normal"]{--accent:#2E7A55}
body[data-mode="charbon"]{--accent:#E2510E}
body[data-mode="exam"]{--accent:#C8102E}
body[data-mode="recup"]{--accent:#6A58B3}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + var(--sb) + 8px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.view{display:none}.view.on{display:block}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Top */
.top{padding:calc(14px + var(--st)) 0 6px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1.big{font-family:var(--f-display);font-stretch:75%;font-weight:850;font-size:clamp(26px,7.4vw,40px);line-height:1;white-space:nowrap;margin:2px 0 0;letter-spacing:-.01em}
.mode-pill{display:flex;align-items:center;gap:7px;padding:9px 12px 9px 11px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.mode-pill svg{width:14px;height:14px}
.mode-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.85}

/* Week strip */
.strip{display:flex;align-items:center;gap:2px;margin:14px -6px 0}
.strip .arr{width:28px;height:52px;color:var(--faint);font-size:22px;flex:none}
.strip .days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:12px;color:var(--muted)}
.sd .l{font-size:12px;font-weight:600}
.sd .n{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--ink);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.sd .p{width:18px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.sd .p i{display:block;height:100%;background:var(--acc)}
.sd.today .n{color:var(--acc)}
.sd[aria-selected="true"] .n{background:var(--ink);color:var(--bg)}
.sd.today[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}

/* Hero */
.hero{margin-top:14px;border-radius:var(--r);padding:16px 16px 14px;background:var(--accent);color:var(--on-accent);position:relative;overflow:hidden}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .t{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:24px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.hero .s{font-size:14px;opacity:.9}
.hero .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff}
.hero .next{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);font-size:14px;display:flex;gap:8px}
.hero .next b{font-weight:700}
.hero .next .num{opacity:.85}
.hero.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hero.quiet .s,.hero.quiet .k{color:var(--muted);opacity:1}

.prog{display:flex;align-items:center;gap:12px;margin:16px 2px 6px;font-size:14px;color:var(--muted)}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--acc);border-radius:3px}
.prog b{color:var(--ink)}
.notice{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 12px 11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.notice span{flex:1}
.notice button{font-weight:700;color:var(--acc);padding:4px 6px}

/* Timeline */
.tl{margin-top:8px;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:stretch;padding:4px 0}
.it .tm{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink);padding-top:12px;text-align:right}
.it .tm small{display:block;font-weight:500;color:var(--faint);font-size:12px}
.card{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px 11px 16px;min-height:52px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--faint))}
.card .bd{flex:1;min-width:0}
.card .ti{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.card .su{font-size:13.5px;color:var(--muted);line-height:1.3;margin-top:1px;overflow-wrap:anywhere}
.it.k-course .card{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.it.k-course .card::before{background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 7px)}
.it.k-free .card{background:transparent;border-style:dashed}
.it.k-free .card::before{display:none}
.it.k-free .ti{font-weight:600;color:var(--muted)}
.it.k-sport .card::before{background:var(--ink)}
.it.k-event .card::before{background:var(--acc)}
.it.k-routine .card::before{background:var(--faint)}
.it.now .card{box-shadow:0 0 0 2px var(--acc)}
.it.past:not(.done) .card{opacity:.6}
.it.done .ti{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk svg{width:18px;height:18px}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.it.k-minor{padding:0}
.it.k-minor .tm{padding-top:4px;font-size:12px;color:var(--faint);font-weight:500}
.minor{font-size:13px;color:var(--faint);padding:4px 0 4px 6px;display:flex;align-items:center;gap:8px}
.minor::before{content:"";width:14px;height:1px;background:var(--line)}
.endday{font-size:13px;color:var(--faint);text-align:center;padding:14px 0 4px}
.short{margin:10px 0 0;font-size:13.5px;color:var(--warn);text-align:center}
.linkbtn{display:block;margin:18px auto 0;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}

/* Calendar */
.cal-h{display:flex;align-items:center;gap:6px;margin:10px 0}
.cal-h b{flex:1;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:22px;text-transform:capitalize}
.cal-h button{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:20px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal .wd{font-size:12px;font-weight:700;color:var(--faint);text-align:center;padding:4px 0}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:12px}
.cell .n{font-family:var(--f-mono);font-size:15px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.cell.out .n{color:var(--faint)}
.cell.today .n{color:var(--acc)}
.cell[aria-selected="true"] .n{background:var(--ink);color:var(--bg)}
.cell.today[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.i-ev{background:var(--acc)} .i-dl{background:var(--warn)} .i-ex{background:var(--exam)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Lists */
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sec-t button{font-size:14px;font-weight:700;color:var(--acc);text-transform:none;letter-spacing:0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);min-height:56px}
.li:last-child{border-bottom:0}
.li .dt{width:12px;height:12px;border-radius:4px;flex:none;background:var(--c,var(--faint))}
.li .bd{flex:1;min-width:0}
.li .ti,.li .su,.row-sw .ti,.row-sw .su{display:block}
.li .ti{font-weight:650;font-size:15.5px;line-height:1.25}
.li .su{font-size:13.5px;color:var(--muted);margin-top:1px}
.li .rt{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none;text-align:right}
.li .chev{color:var(--faint);flex:none}
.dayhead{font-size:12.5px;font-weight:700;color:var(--faint);padding:10px 14px 0;background:var(--surface)}
.empty{padding:16px 14px;color:var(--muted);font-size:14.5px}
.row-sw{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row-sw:last-child{border-bottom:0}
.row-sw .bd{flex:1}
.row-sw .ti{font-weight:650}
.row-sw .su{font-size:13.5px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--sunk);position:relative;flex:none;transition:background .2s;border:1px solid var(--line);margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.p-head{padding:calc(14px + var(--st)) 0 0}
.p-head p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.status{padding:14px;font-size:14.5px;line-height:1.45}
.status b{display:block;font-size:16px;margin-bottom:2px}
.status ol{margin:8px 0 0;padding-left:20px}
.status li{margin:3px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15.5px;background:var(--surface);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--exam)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
details.more{border-top:1px solid var(--line)}
details.more summary{list-style:none;padding:13px 14px;font-weight:650;color:var(--acc);cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
.hint{font-size:13px;color:var(--muted);padding:0 4px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--nav-h) + var(--sb) + 16px);width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px rgba(0,0,0,.22);display:grid;place-items:center;z-index:9}
.fab svg{width:26px;height:26px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto;height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11.5px;font-weight:650}
.nav svg{width:25px;height:25px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--acc)}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,14,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:calc(100% - var(--st) - 24px);overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sb));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);-webkit-overflow-scrolling:touch}
.sheet-bg.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-h h2{flex:1;margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:24px;line-height:1.1}
.sh-h button{width:34px;height:34px;border-radius:50%;background:var(--sunk);color:var(--muted);font-size:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.f label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 5px 2px}
.f input,.f select{width:100%;min-width:0;height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 4px;border-radius:9px;font-weight:650;font-size:14.5px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{margin:0}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.sh-actions{display:flex;gap:10px;margin-top:18px}
.sh-actions .btn{flex:1}
.modes{display:grid;gap:8px}
.mopt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.mopt .sw8{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none;background:var(--m)}
.mopt b{display:block;font-size:16.5px}
.mopt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.mopt[aria-checked="true"]{border-color:var(--m);background:color-mix(in srgb,var(--m) 8%,var(--surface))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:650}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.25}
.stat.warn .v{color:var(--warn)}
.subrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.subrow:last-child{border-bottom:0}
.subrow .num{font-size:13px;color:var(--muted)}
.subrow .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.subrow .bar b{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 30%,transparent)}
.subrow .bar i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.alert{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
textarea.box{width:100%;min-height:110px;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sb) + 16px);transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* States added in v3 */
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)}
.tag.cu{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--acc)}
.it.missed .card{border-style:dashed;background:transparent}
.it.missed .ti{color:var(--muted)}
.day-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.day-actions .linkbtn{margin:0}
.i-off{background:var(--faint)}
body[data-mode="rattrapage"]{--accent:#B7791F}

/* Bubble buttons: springy press, glossy primaries, a soft bubble where you touch */
.btn,.linkbtn,.li,.mopt,.mode-pill,.fab,.sd,.cell,.chk,.nav button,.notice button,.cal-h button,.sh-h button,.seg span,.swatches span,.strip .arr,.sec-t button{transition:transform .38s cubic-bezier(.3,1.9,.5,1),box-shadow .2s,background-color .2s;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none}
.btn:active,.linkbtn:active,.mopt:active,.mode-pill:active,.fab:active,.sd:active,.cell:active,.chk:active,.cal-h button:active,.sh-h button:active,.notice button:active,.strip .arr:active,.sec-t button:active{transform:scale(.9);transition-duration:.12s}
.li:active{transform:scale(.97);transition-duration:.12s}
.nav button:active svg{transform:scale(.8)}
.nav svg{transition:transform .38s cubic-bezier(.3,1.9,.5,1)}
.nav button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.btn,.linkbtn{border-radius:999px}
.btn.pri,.mode-pill,.fab{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.08)}
.linkbtn,.btn:not(.pri){box-shadow:0 2px 8px rgba(20,10,30,.06),inset 0 1px 0 rgba(255,255,255,.6)}
.chk[aria-pressed="true"]{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.bub{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:translate(-50%,-50%) scale(0);animation:bub .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bub{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.chk.pop{animation:pop .42s cubic-bezier(.3,1.9,.5,1)}
.chk.pop::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--acc);animation:ring .42s ease-out forwards}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
.chk{overflow:visible}

/* backlog */
.navic{position:relative;display:inline-flex}
.nbadge{position:absolute;top:-6px;left:15px;font-style:normal;font-size:10px;font-weight:800;line-height:1;padding:3px 5px;border-radius:999px;background:var(--warn);color:#fff;white-space:nowrap}
.bl-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.bl-row:last-child{border-bottom:0}
.bl-row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c,var(--faint))}
.bl-row .bd{flex:1;min-width:0;text-align:left;display:block}
.bl-row .ti{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.bl-row .su{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.bl-row .more{flex:none;font-weight:700;font-size:13.5px;color:var(--acc);padding:7px 10px;border-radius:999px;border:1px solid var(--line)}
.bl-row.done .ti{text-decoration:line-through;color:var(--muted)}
.notice [data-tab-go]{font-weight:700;color:var(--acc);padding:4px 6px}
/* série marker */
.it.k-ms{padding:2px 0}
.it.k-ms .tm{padding-top:10px}
.ms{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 6%,transparent)}
.ms .flag{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.ms .flag svg{width:15px;height:15px}
.ms .bd{flex:1;min-width:0}.ms b{display:block;font-size:14.5px}.ms small{display:block;font-size:12.5px;color:var(--muted)}
.ms .chk{background:var(--surface)}
.it.k-ms.done .ms{border-style:solid;opacity:.75}.it.k-ms.done b{text-decoration:line-through}
/* check-in */
.ci-card{position:relative;padding:14px 14px 14px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.ci-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ci-card .num{display:block;font-size:13px;color:var(--muted)}.ci-card b{display:block;font-size:18px;margin-top:2px}.ci-card small{display:block;color:var(--muted);font-size:14px}
.ci-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ci-opts .btn.pri{grid-column:1/-1}
.it.missed .bd[data-act]{cursor:pointer}
/* proposals */
.prop{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--acc)}
.prop>b{display:block;font-size:16px}.prop p{margin:4px 0 12px;font-size:14px;color:var(--muted)}
/* stretching */
.it.k-stretch .card::before{background:linear-gradient(180deg,#10B981,#0EA5E9)}
.it.k-stretch .bd[data-act]{cursor:pointer}
.st-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.st-row:last-child{border-bottom:0}
.st-row .st-n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sunk);font-weight:800;font-size:13px}
.st-row .bd{flex:1;min-width:0}.st-row .ti{display:block;font-weight:700}.st-row .su{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.st-row .st-t{font-size:13px;color:var(--muted);flex:none;margin-top:3px}
.st-row.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.st-row.on .st-n{background:var(--accent);color:#fff}
.st-row.ok .st-n{background:#10B981;color:#fff}
.st-now{margin-top:12px;padding:14px;border-radius:14px;background:var(--accent);color:#fff;text-align:center;background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%)}
.st-now b{display:block;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:22px}
.st-now span{font-size:14.5px;opacity:.92}
/* backlog order */
.bl-row .rk{width:20px;flex:none;text-align:center;font-weight:700;color:var(--faint);font-size:13px}
.bl-row .why{display:block;font-size:12.5px;color:var(--acc);font-weight:650;margin-top:3px}
.arrows{display:flex;flex-direction:column;gap:4px;flex:none}
.arrows button{width:34px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:11px;color:var(--muted)}
.arrows button:disabled{opacity:.3}
/* auto tag in the mode pill */
.autotag{font-size:11px;font-weight:700;opacity:.85;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.22);margin-left:2px}
/* plan-changed card */
.upd{position:fixed;left:50%;top:calc(var(--st) + 10px);z-index:45;display:flex;gap:11px;align-items:center;width:min(92vw,420px);padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,5,20,.18);transform:translate(-50%,-140%);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.upd.on{transform:translate(-50%,0);opacity:1}
.upd .ic{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:#fff;background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%)}
.upd .ic svg{width:17px;height:17px}
.upd b{display:block;font-size:15px}
.upd small{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
@media (prefers-reduced-motion:reduce){.bub,.chk.pop,.chk.pop::after{animation:none}}
.fab{position:fixed!important}
body[data-mode="avance"]{--accent:#0F766E}
.i-trip{background:#0F766E}.i-mock{background:#DB2777}
.rec{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.45;margin-bottom:12px}
.badge{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--m);color:#fff;margin-left:6px;vertical-align:2px}
.pickweek{margin-top:14px;border-radius:var(--r);padding:14px;background:var(--surface);border:1.5px solid var(--acc)}
.pickweek .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pickweek>b{display:block;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:21px;margin:3px 0 4px}
.pickweek p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.chipsel{display:flex;flex-wrap:wrap;gap:7px}
.chipm{padding:9px 14px;border-radius:999px;border:1.5px solid var(--m);color:var(--ink);font-weight:700;font-size:14.5px;transition:transform .38s cubic-bezier(.3,1.9,.5,1);position:relative;overflow:hidden}
.chipm:active{transform:scale(.9)}
.chipm.rec{box-shadow:0 0 0 3px color-mix(in srgb,var(--m) 25%,transparent)}
.chipm.on{background:var(--m);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-mode="normal">

      <div><div class="eyebrow" id="tEyebrow"></div><h1 class="big" id="tTitle"></h1></div>

  </div>
